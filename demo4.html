<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriela's Design Lab v4</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0f;
      --accent: #6C5CE7;
      --accent-glow: rgba(108, 92, 231, 0.4);
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-mute: #9ca3af;
      --font-head: 'Playfair Display', serif;
      --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); padding: 40px 20px; line-height: 1.6; }
    .container { max-width: 500px; margin: 0 auto; }

    /* --- PROJECT BRIEF SECTION --- */
    .project-brief {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .brief-label { color: var(--accent); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 10px; }
    .project-brief textarea {
      width: 100%; background: transparent; border: none; color: #fff;
      font-family: inherit; font-size: 0.95rem; resize: none; outline: none;
      min-height: 80px;
    }
    .project-brief textarea::placeholder { color: var(--text-mute); opacity: 0.5; }

    /* --- SEARCH & TAGS --- */
    .search-input {
      width: 100%; padding: 16px 24px; border-radius: 30px;
      background: #15151a; border: 1px solid var(--border);
      color: #fff; font-size: 1rem; margin-bottom: 20px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
    .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 30px; }
    .tag {
      padding: 6px 14px; background: var(--glass); border: 1px solid var(--border);
      border-radius: 20px; font-size: 0.75rem; color: var(--text-mute); cursor: pointer; transition: 0.2s;
    }
    .tag:hover, .tag.active { border-color: var(--accent); color: #fff; background: var(--accent-glow); }

    /* --- MOCKUP ART --- */
    .phone-mockup {
      width: 280px; height: 540px; margin: 0 auto;
      border: 8px solid #252525; border-radius: 40px;
      background: #000; overflow: hidden; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .phone-screen { height: 100%; background: #fff; overflow-y: auto; display: flex; flex-direction: column; padding-top: 20px; }
    .phone-screen::-webkit-scrollbar { display: none; }

    /* CSS Art Components */
    .w-header { height: 45px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; padding: 0 15px; align-items: center; flex-shrink: 0; }
    .w-logo { width: 60px; height: 10px; background: #222; border-radius: 2px; }
    .w-hero { width: 100%; flex-shrink: 0; }
    .w-hero.modern { height: 160px; background: #f8f9fa; padding: 25px; text-align: center; }
    .w-hero.visual { height: 200px; background: #ccc; display: flex; align-items: flex-end; padding: 15px; background-size: cover; }
    .w-h1 { height: 14px; background: #222; margin: 0 auto 10px; width: 70%; border-radius: 2px; }
    .w-line { height: 6px; background: #ddd; margin-bottom: 6px; border-radius: 3px; }
    .w-btn { padding: 8px 16px; background: #222; color: #fff; font-size: 0.6rem; font-weight: bold; border-radius: 20px; display: inline-block; }
    .w-btn.accent { background: var(--accent); }
    .w-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
    .w-card { background: #f4f4f4; border-radius: 6px; overflow: hidden; }
    .w-card-img { height: 80px; background: #e0e0e0; }
    .w-text-block { padding: 15px; }
    .w-footer { background: #1a1a1a; height: 80px; margin-top: auto; padding: 15px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header style="text-align: center; margin-bottom: 30px;">
      <h1 style="font-family: var(--font-head); font-style: italic; font-size: 2.2rem;">Design Lab</h1>
      <p style="color: var(--text-mute); font-size: 0.9rem;">Structure your vision before we build.</p>
    </header>

    <div class="project-brief">
      <span class="brief-label">Project Brief</span>
      <textarea id="projectNotes" placeholder="Describe the vibe, goals, or specific features you need..."></textarea>
    </div>

    <input type="text" class="search-input" id="industryInput" placeholder="Type an industry..." oninput="filterIndustries(this.value)">
    
    <div class="tag-cloud" id="tagCloud">
      </div>

    <div class="phone-mockup">
      <div class="phone-screen" id="screen">
        </div>
    </div>
  </div>

  <script>
    const INDUSTRY_DATA = {
      "Bakery / Donut Shop": { layout: "L-01" },
      "Coffee Shop / Café": { layout: "L-01" },
      "Art Gallery": { layout: "L-19" },
      "Boutique / Jewelry": { layout: "L-20" },
      "Law / Financial": { layout: "L-23" },
      "Tech Startup": { layout: "L-24" },
      "Photography": { layout: "L-19" },
      "Real Estate": { layout: "L-24" },
      "Fitness / Yoga": { layout: "L-01" }
    };

    const LAYOUT_MAP = {
      "L-01": ["header", "heroVisual:Welcome", "textBlock", "grid2", "footer"],
      "L-19": ["header", "heroModern:Portfolio", "grid2", "textBlock", "footer"],
      "L-20": ["header", "heroVisual:Shop", "grid2", "cta:View All", "footer"],
      "L-23": ["header", "heroModern:Corporate", "textBlock", "grid2", "footer"],
      "L-24": ["header", "heroModern:Search...", "grid2", "footer"],
      "default": ["header", "heroModern", "textBlock", "footer"]
    };

    const RENDERERS = {
      header: () => `<div class="w-header"><div class="w-logo"></div><div style="width:15px;height:15px;background:#eee;border-radius:50%"></div></div>`,
      heroModern: (txt="Learn More") => `<div class="w-hero modern"><div class="w-h1"></div><div class="w-line" style="width:40%;margin:0 auto 15px;"></div><div class="w-btn">${txt}</div></div>`,
      heroVisual: (txt="Explore") => `<div class="w-hero visual" style="background-color:#e0e0e0"><div class="w-btn accent">${txt}</div></div>`,
      grid2: () => `<div class="w-grid-2">${Array(4).fill('<div class="w-card"><div class="w-card-img"></div><div style="padding:8px"><div class="w-line" style="width:60%"></div></div></div>').join('')}</div>`,
      textBlock: () => `<div class="w-text-block"><div class="w-line"></div><div class="w-line"></div><div class="w-line" style="width:60%"></div></div>`,
      cta: (txt) => `<div style="text-align:center;padding:20px;"><div class="w-btn accent">${txt}</div></div>`,
      footer: () => `<div class="w-footer"><div class="w-line" style="background:#333;width:40%"></div></div>`
    };

    function selectIndustry(name) {
      document.querySelectorAll('.tag').forEach(t => t.classList.toggle('active', t.innerText === name));
      
      const data = INDUSTRY_DATA[name] || { layout: "default" };
      const structure = LAYOUT_MAP[data.layout];
      const screen = document.getElementById('screen');
      screen.innerHTML = '';
      
      structure.forEach(blockStr => {
        const [funcName, arg] = blockStr.split(':');
        if(RENDERERS[funcName]) screen.insertAdjacentHTML('beforeend', RENDERERS[funcName](arg));
      });
    }

    function filterIndustries(val) {
      const cloud = document.getElementById('tagCloud');
      cloud.innerHTML = '';
      const matches = Object.keys(INDUSTRY_DATA).filter(k => k.toLowerCase().includes(val.toLowerCase()));
      
      matches.slice(0, 8).forEach(ind => {
        const t = document.createElement('div');
        t.className = 'tag';
        t.innerText = ind;
        t.onclick = () => selectIndustry(ind);
        cloud.appendChild(t);
      });
    }

    // Initialize with a default
    window.onload = () => {
      filterIndustries('');
      selectIndustry("Coffee Shop / Café");
    };
  </script>

</body>
</html>
